<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Scripart 약관</title>
<style>
:root { --paper:#F3ECDF; --card:#FAF6EE; --ink:#2B2420; --muted:#7A6E64; --line:#E2D8C8; --accent:#C9563E; }
@media (prefers-color-scheme: dark) {
  :root { --paper:#1E1A17; --card:#27221E; --ink:#EDE6DA; --muted:#A89C90; --line:#3A332D; --accent:#E07A60; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink);
  font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  word-break: keep-all; overflow-wrap: anywhere; }
main { max-width: 720px; margin: 0 auto; padding: 48px 16px 72px; }
h1, h2 { font-family: "Noto Serif KR", "AppleMyungjo", "Batang", serif; font-weight: 700; line-height: 1.35; }
h1 { font-size: 28px; margin: 0 0 8px; }
h2 { font-size: 19px; margin: 36px 0 10px; }
p { margin: 0 0 12px; }
ul { margin: 0 0 12px; padding-left: 20px; }
li { margin-bottom: 6px; }
li::marker { color: var(--muted); }
.date { color: var(--muted); margin-bottom: 28px; }
nav { margin-bottom: 32px; font-size: 14px; }
a { color: var(--accent); }
.links { list-style: none; padding: 0; }
.links a { display:block; padding:16px 18px; background:var(--card); border:1px solid var(--line);
  border-radius: 14px; color: var(--ink); text-decoration: none; font-size: 17px; margin-bottom: 10px; }
</style>
</head>
<body>
<main>

<h1>Scripart 약관</h1>
<ul class="links"><li><a href="terms.html">이용약관</a></li><li><a href="privacy.html">개인정보처리방침</a></li></ul>
</main>
</body>
</html>
